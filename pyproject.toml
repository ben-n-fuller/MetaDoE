[project]
name = "metadoe"
version = "0.1.0"
description = "Metaheuristic optimization tools for design of experiments."
readme = "README.md"
authors = [
    { name = "Ben Fuller", email = "ben.fuller@conexusinc.com" }
]
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.15.1",
    "matplotlib>=3.10.7",
    "numpy==1.26.4",
    "pandas>=2.3.3",
    "phate>=2.0.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    "scprep>=1.1.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.5",
    "ipykernel>=6.29.0"
]

[project.scripts]
metadoe = "metadoe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
